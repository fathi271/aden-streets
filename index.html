
<title>شوارع عدن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen 3D canvas; HUD pinned to screen edges; menu card floats over the live city. Single dark "dusk over the harbour" look. */
:root{
  --ink:#0d1a22;          /* deep harbour night */
  --panel:rgba(13,26,34,.78);
  --line:rgba(255,236,214,.16);
  --text:#fbf3e8;
  --muted:#b8c4c9;
  --copper:#e8743b;       /* clock-tower roof */
  --sea:#1fa3a8;          /* Gold Mohur water */
  --curb:#f2c230;         /* Aden yellow kerb */
  --danger:#e5484d;
  --display:"Lalezar","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:var(--body);font-size:15px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
button{font-family:var(--body);cursor:pointer;color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid var(--curb);outline-offset:2px}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;z-index:20;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(13,26,34,.15),rgba(13,26,34,.75))}
.card{width:min(420px,100%);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;direction:rtl;margin:auto;touch-action:pan-y}
@media (max-height:760px){.brand h1{font-size:42px}.brand p{font-size:13px}.card{gap:10px;padding:16px}.sw{width:34px;height:34px}}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:1;margin:0;color:var(--text);letter-spacing:0}
.brand h1 span{color:var(--copper)}
.brand p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.kerb{height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--curb) 0 22px,#111 22px 44px)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
label.f input{font-family:var(--body);font-size:16px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{border-color:var(--text);transform:scale(1.08)}
.go{font-family:var(--display);font-size:26px;font-weight:400;background:var(--copper);border:0;border-radius:12px;padding:10px 12px 6px;color:#1b0e06}
.go:active{transform:translateY(1px)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.note b{color:var(--text);font-weight:700}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;direction:rtl}
#hud[hidden]{display:none}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));left:calc(150px + max(10px,env(safe-area-inset-left,0px)));
  display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%}
button.chip{font-size:13px}
button.chip.on{background:var(--sea);border-color:transparent;color:#04252a}
#mini{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));width:132px;height:132px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
#speedo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;direction:ltr}
#spd{font-family:var(--display);font-size:56px;line-height:.9;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#spdu{font-size:12px;color:var(--muted);font-weight:700}
#nitro{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin:6px auto 0;overflow:hidden}
#nitro i{display:block;height:100%;width:100%;background:var(--copper)}
#toast{position:absolute;top:calc(122px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(440px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.55;text-align:center;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
#place{position:absolute;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-family:var(--display);font-size:22px;color:var(--curb);text-shadow:0 2px 10px rgba(0,0,0,.7);white-space:nowrap;opacity:0;transition:opacity .5s}
#place.show{opacity:1}
#mission{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--curb);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;white-space:nowrap;max-width:92vw}
#mission b{font-size:15px}#mission span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}#mission em{font-style:normal;font-size:12px;color:var(--curb)}

/* ---------- touch pads ---------- */
.pad{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;pointer-events:auto;direction:ltr}
#padL{left:max(14px,env(safe-area-inset-left,0px))}
#padR{right:max(14px,env(safe-area-inset-right,0px));align-items:flex-end}
.pb{width:70px;height:70px;border-radius:50%;background:rgba(13,26,34,.55);border:2px solid rgba(255,255,255,.22);font-size:26px;font-weight:800;display:grid;place-items:center;touch-action:none}
.pb.big{width:84px;height:84px;background:rgba(232,116,59,.55)}
.pb.sm{width:58px;height:58px;font-size:14px}
.pb.held{background:rgba(242,194,48,.75);color:#1b0e06}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
.keys{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(14px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted);background:var(--panel);padding:8px 10px;border-radius:10px;line-height:1.7}
@media (pointer:coarse){.keys{display:none}}
@media (prefers-reduced-motion:reduce){#toast,#place{transition:none}}
</style>

<div id="stage"></div>

<div id="menu">
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <h1>شوارع <span>عدن</span></h1>
      <p>سُق في كورنيش ساحل أبين، لِف حول جولة البسيري، واعبر نفق العقبة إلى كريتر مع صاحبك أونلاين.</p>
    </div>
    <div class="kerb" aria-hidden="true"></div>
    <label class="f">اسمك في اللعبة
      <input id="nm" maxlength="16" placeholder="مثلاً: فتحي" enterkeyhint="go">
    </label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500">لون سيارتك
      <div class="swatches" id="sws"></div>
    </div>
    <label class="f">رمز الغرفة (نفس الرمز عندك وعند صاحبك)
      <input id="code" maxlength="20" value="عدن">
    </label>
    <button class="go" type="button" id="goBtn">ابدأ القيادة</button>
    <p class="note" id="modeNote"></p>
  </form>
</div>

<div id="hud" hidden>
  <canvas id="mini" width="264" height="264"></canvas>
  <div class="top">
    <span class="chip" id="net"><span class="dot" style="background:var(--muted)"></span><span id="netTxt">جارٍ الاتصال…</span></span>
    <span class="chip" id="plist" hidden></span>
    <span class="chip" id="cashChip">💰 <span id="cash">0</span></span>
    <button class="chip" id="taxiBtn" type="button">🚕 توصيل ركاب</button>
    <button class="chip" id="micBtn" type="button">🎤 المايك</button>
    <button class="chip" id="hornBtn" type="button">📯 هرن</button>
    <button class="chip" id="camBtn" type="button">🎥 كاميرا</button>
    <button class="chip" id="rstBtn" type="button">↺ إعادة</button>
  </div>
  <div id="toast" role="status"></div>
  <div id="place"></div>
  <div id="mission" hidden></div>
  <div id="speedo"><div id="spd">0</div><div id="spdu">كم/س</div><div id="nitro"><i id="nitroBar"></i></div></div>
  <div class="pad" id="padL">
    <button class="pb" data-k="left" type="button" aria-label="يسار">◀</button>
    <button class="pb" data-k="right" type="button" aria-label="يمين">▶</button>
  </div>
  <div class="pad" id="padR">
    <div class="col">
      <button class="pb sm" data-k="nitro" type="button">نيترو</button>
      <button class="pb sm" data-k="hand" type="button">هاند</button>
    </div>
    <button class="pb" data-k="back" type="button" aria-label="فرامل">▼</button>
    <button class="pb big" data-k="gas" type="button" aria-label="بنزين">▲</button>
  </div>
  <div class="keys">W/↑ بنزين · S/↓ فرامل · A D توجيه<br>Shift نيترو · Space هاند · H هرن · C كاميرا</div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ================= renderer / scene ================= */
const isTouch=matchMedia("(pointer:coarse)").matches;
const renderer=new THREE.WebGLRenderer({antialias:!isTouch,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,isTouch?1.4:1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
$("stage").appendChild(renderer.domElement);
const scene=new THREE.Scene();
const SKY=new THREE.Color("#bfd8e8");
scene.fog=new THREE.Fog(SKY,180,760);
const camera=new THREE.PerspectiveCamera(62,1,0.5,2200);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?75:62;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

scene.add(new THREE.HemisphereLight("#dcefff","#8a7458",0.75));
const sun=new THREE.DirectionalLight("#fff1d6",0.95);sun.position.set(-200,300,-120);scene.add(sun);

/* ================= textures ================= */

function boxGeo(w,h,d,uw,uh){const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;
  for(let f=0;f<6;f++){let su,sv;if(f<2){su=d/uw;sv=h/uh}else if(f<4){su=1;sv=1}else{su=w/uw;sv=h/uh}

function triMonument(x,z){const g=new THREE.Group();
  const outer=new THREE.Shape();outer.moveTo(-6,0);outer.lineTo(0,11);outer.lineTo(6,0);outer.lineTo(-6,0);
  const hole=new THREE.Path();hole.moveTo(-3,3.2);hole.lineTo(0,8.4);hole.lineTo(3,3.2);hole.lineTo(-3,3.2);outer.holes.push(hole);
  const tri=new THREE.Mesh(new THREE.ExtrudeGeometry(outer,{depth:1.2,bevelEnabled:false}),M.maroon);tri.position.set(0,1.6,-.6);g.add(tri);

const traffic=[];
function buildLoop(x0,z0,x1,z1){const C=[[x0,z0],[x1,z0],[x1,z1],[x0,z1]];const pts=[];
  for(let i=0;i<4;i++){const A=C[i],B=C[(i+1)%4];let dx=B[0]-A[0],dz=B[1]-A[1];const L=Math.hypot(dx,dz);dx/=L;dz/=L;const rx=-dz*3.5,rz=dx*3.5;
    const a=[A[0]+rx+dx*4,A[1]+rz+dz*4],b=[B[0]+rx-dx*4,B[1]+rz-dz*4];pts.push(a);
    // detour around roundabouts on this segment
    for(const R of ROUND){const t=((R.x-A[0])*dx+(R.z-A[1])*dz);if(t<=8||t>=L-8)continue;const px=A[0]+dx*t,pz=A[1]+dz*t;if(Math.hypot(px-R.x,pz-R.z)>1)continue;const D=R.r+6;
      for(let k=0;k<=8;k++){const th=Math.PI*k/8;const along=-Math.cos(th)*D,side=Math.sin(th)*D;pts.push([R.x+dx*along+(-dz)*side,R.z+dz*along+dx*side])}}
    pts.push(b)}
  // lengths
  const segs=[];let tot=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,l,s:tot});tot+=l}
  return{segs,tot}}

function stepPeds(dt,carSpeed){const cx=camera.position.x,cz=camera.position.z;
  const fx=Math.sin(P.r),fz=Math.cos(P.r);
  for(const p of peds){
    if(p.v){p.d+=p.v*p.dir*dt;p.ph+=p.v*dt*5.5}
    const q=loopPos(p.path.lp,p.d);

    if(playing){const dx=q.x+p.ox-P.x,dz=q.z+p.oz-P.z,dist=Math.hypot(dx,dz);
      if(dist<9&&Math.abs(carSpeed)>2.5&&(dx*fx+dz*fz)>0){const side=(dx*fz-dz*fx)>=0?1:-1;p.txo=fz*side*2.8;p.tzo=-fx*side*2.8;p.ph+=dt*10}
      else{p.txo*=1-Math.min(1,dt*.5);p.tzo*=1-Math.min(1,dt*.5)}}

function stepPlayer(dt){

  const c=collide(nx,nz,2.1);nx=c.px;nz=c.pz;
  if(c.hit){const vn=P.vx*c.hit.nx+P.vz*c.hit.nz;if(vn<0){P.vx-=c.hit.nx*vn*1.35;P.vz-=c.hit.nz*vn*1.35;P.vx*=.75;P.vz*=.75;if(vn<-12)bump(Math.min(1,-vn/40))}}

  P.x=nx;P.z=nz;
  return fwd;
}

  for(const id in remotes){const R=remotes[id];mg.fillStyle=R.c;mg.strokeStyle="#fff";mg.lineWidth=3;mg.beginPath();mg.arc(R.x,R.z,9,0,7);mg.fill();mg.stroke()}
  {const tg=TX.on&&txTarget();if(tg){const dx=tg.x-P.x,dz=tg.z-P.z,d=Math.hypot(dx,dz),k=Math.min(1,135/(d||1));mg.fillStyle=TX.state==="pickup"?"#f2c230":"#3dd68c";mg.strokeStyle="#111";mg.lineWidth=3;mg.beginPath();mg.arc(P.x+dx*k,P.z+dz*k,12,0,7);mg.fill();mg.stroke()}}
  mg.restore();mg.fillStyle=myColor;mg.strokeStyle="#fff";mg.lineWidth=3;mg.beginPath();mg.moveTo(W/2,W/2-14);mg.lineTo(W/2+10,W/2+11);mg.lineTo(W/2-10,W/2+11);mg.closePath();mg.fill();mg.stroke()}

/* ================= loop ================= */
const camPos=new THREE.Vector3(260,60,60),camLook=new THREE.Vector3();
let last=performance.now(),sendT=0,miniT=0,menuT=0,seaT=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;seaT+=dt;
  T.sea.offset.set(seaT*.004,seaT*.01);
  // traffic
  for(const t of traffic){let v=t.v;if(playing){const p=loopPos(t.lp,t.d+8);if(Math.hypot(p.x-P.x,p.z-P.z)<6)v=0}t.d+=v*dt;const p=loopPos(t.lp,t.d);t.x=p.x;t.z=p.z;t.m.position.set(p.x,0,p.z);let dr=p.r-t.m.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));t.m.rotation.y+=dr*Math.min(1,dt*8)}
  // remotes
  for(const id in remotes){const R=remotes[id];R.x+=(R.tx-R.x)*Math.min(1,dt*10);R.z+=(R.tz-R.z)*Math.min(1,dt*10);let dr=R.tr-R.r;dr=Math.atan2(Math.sin(dr),Math.cos(dr));R.r+=dr*Math.min(1,dt*10);R.m.position.set(R.x,groundY(R.x,R.z),R.z);R.m.rotation.y=R.r;
    for(const w of R.m.userData.wheels)w.rotation.x+=R.s/3.6*dt/.42}
  let fwd=0;
  if(playing){
    fwd=stepPlayer(dt);
    car.position.set(P.x,groundY(P.x,P.z),P.z);car.rotation.y=P.r;car.rotation.z=-P.steer*Math.min(1,Math.abs(fwd)/40)*.05;
    for(const w of car.userData.wheels)w.rotation.x+=fwd*dt/.42;
    car.userData.wheels[0].rotation.y=car.userData.wheels[1].rotation.y=P.steer*.4;
    $("spd").textContent=Math.round(Math.abs(fwd)*3.6);$("nitroBar").style.width=(P.nitro*100).toFixed(0)+"%";
    engineSound(fwd,input.gas);
    // camera
    const fx=Math.sin(P.r),fz=Math.cos(P.r),sp=Math.abs(fwd);
    const dist=camMode===1?17:8.5+sp*.06,hgt=camMode===1?8.5:3.6+sp*.02;
    let want,look;
    car.visible=camMode!==2;
    if(camMode===2){want=new THREE.Vector3(P.x+fx*.2,1.45,P.z+fz*.2);look=new THREE.Vector3(P.x+fx*20,1.2,P.z+fz*20);camPos.copy(want)}
    else{want=new THREE.Vector3(P.x-fx*dist,hgt,P.z-fz*dist);look=new THREE.Vector3(P.x+fx*4,1.4,P.z+fz*4);camPos.lerp(want,Math.min(1,dt*6))}
    camLook.lerp(look,Math.min(1,dt*10));camera.position.copy(camPos);camera.lookAt(camLook);
    camera.fov+=(((innerWidth<innerHeight)?75:62)+(input.nitro&&input.gas&&P.nitro>.02?8:0)-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();
    sendT+=dt;if(net&&sendT>.066){sendT=0;net.send(myState())}
    miniT+=dt;if(miniT>.05){miniT=0;drawMini();
      let best=null;for(const pl of PLACES){if(Math.hypot(pl.x-P.x,pl.z-P.z)<pl.r&&(!best||pl.r<best.r))best=pl}if(best)showPlace(best.n);else lastPlace=""}
  }else{ // menu flyover
    menuT+=dt*.06;const cx=120,cz=-120;camera.position.set(cx+Math.cos(menuT)*190,70,cz+Math.sin(menuT)*190);camera.lookAt(cx,8,cz);
    car.position.set(P.x,0,P.z);car.rotation.y=P.r}
  stepPeds(dt,fwd);cullStalls(dt);if(playing)stepTaxi(dt,fwd);if(ferris)ferris.wheel.rotation.z+=dt*.1;
  renderer.render(scene,camera)}
requestAnimationFrame(frame);
addEventListener("pagehide",()=>{try{net&&net.leave()}catch(e){}});
})();
